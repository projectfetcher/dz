name: Scraper
on:
  schedule:
    - cron: '18 4,10,16,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          MISTRAL_API_KEY:  ${{ secrets.MISTRAL_API_KEY }}
          WP_USERNAME:      ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD:  ${{ secrets.WP_APP_PASSWORD }}
          WP_BASE_URL:      ${{ secrets.WP_BASE_URL }}
          INTERNAL_BOT_KEY: ${{ secrets.INTERNAL_BOT_KEY }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          MAKE_SECRET:      ${{ secrets.MAKE_SECRET }}
        run: python dz.py

      - name: Save tracker back to repo
        if: always()
        run: |
          git config user.name "scraper-bot"
          git config user.email "scraper-bot@users.noreply.github.com"
          git add processed_jobs_algeria.csv || true
          git diff --staged --quiet || git commit -m "Update processed jobs tracker [skip ci]"
          git push || true

      - name: Upload Excel output as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobs-output-${{ github.run_id }}
          path: |
            jobs_output_algeria.xlsx
            processed_jobs_algeria.csv
          retention-days: 7
